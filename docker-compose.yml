version: "3.9"

services:
  backend:
    build:
      context: ./backend
    environment:
      OCR_ENGINE: mock
      AUTH_REQUIRED: "false"
      # DB và ảnh tạm của job phải nằm trên volume, nếu không mỗi lần build lại container là mất dữ liệu.
      DATABASE_URL: sqlite+aiosqlite:////app/data/viescanner.db
      JOB_TMP_DIR: /app/data/tmp/jobs
      JWT_SECRET: ${JWT_SECRET:-}
    volumes:
      - backend-data:/app/data
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  backend-data:
