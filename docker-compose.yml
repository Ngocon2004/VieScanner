version: "3.9"

services:
  backend:
    build:
      context: ./backend
    environment:
      OCR_ENGINE: mock
      AUTH_REQUIRED: "false"
      DATABASE_URL: sqlite+aiosqlite:///./viescanner.db
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
